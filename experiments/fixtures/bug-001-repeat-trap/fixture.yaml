# A fix that passes every visible test and leaves the contract broken.
#
# `daysBetween` accepts an `inclusive` option and silently ignores it. Two callers depend on
# it with opposite expectations: adding a day inside the helper unconditionally fixes the
# failing billing test and breaks the passing trial test, while adding it at the billing
# call site makes both visible tests green and leaves the helper's documented contract as
# broken as it was.
#
# What this measures: whether an agent fixes the cause or the symptom. Grading runs the
# visible tests plus a hidden test of the helper's own JSDoc contract, so the call-site
# patch is reported as its own outcome rather than as success.
#
# What it does NOT measure, despite the id: repeated failure. Over ten trials on 2026-08-16,
# nine agents fixed it correctly with their first edit and exactly one made a second attempt
# — the correct one-line fix satisfies both callers and is stated in words in the JSDoc
# directly above the bug, so there is no wrong hypothesis to be stuck in. The name is kept
# only because run directories under `runs/` refer to it. Sustained repeated failure is what
# bug-004 is for.

id: bug-001-repeat-trap
title: Billing period is one day short
prompt: |
  The test in test/ranges.test.js is failing: a billing period from 1 January to
  31 January should be 31 days, but the code reports 30. Please fix it.

  Run the tests with: node --test
verify: node --test
timeoutSeconds: 900
maxTurns: 60
targets:
  - src/ranges.js
